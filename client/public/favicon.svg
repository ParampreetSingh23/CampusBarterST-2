<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Primary Purple/Blue Gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <!-- Secondary Blue/Teal Gradient -->
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Base Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Deep Drop Shadow for Antigravity Look -->
    <filter id="floatShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background base to make it pop safely in all environments -->
  <!-- Commented out background so the icon itself is transparent and beautiful -->

  <!-- Top Right Orb (Teal/Blue) -->
  <circle cx="65" cy="35" r="22" fill="url(#secondaryGradient)" filter="url(#floatShadow)" />
  
  <!-- Bottom Left Orb (Purple/Blue) -->
  <circle cx="35" cy="65" r="26" fill="url(#primaryGradient)" filter="url(#floatShadow)" />

  <!-- The "Exchange" Intersection -->
  <!-- Glassmorphic infinity loop/arrow or intersecting capsule -->
  <g filter="url(#glow)">
    <path d="M 45 40 L 70 65" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 65 65 L 70 65 L 70 60" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M 55 60 L 30 35" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 35 35 L 30 35 L 30 40" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
